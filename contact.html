<section class="contact wrap interior" id="contact"><div class="contact-grid"><div><span class="eyebrow">Project enquiries</span><h1>Tell me what you’re building.</h1><p>Share a little about your business, what you need, and when you’d like to launch.</p></div><form id="brief"><div class="fields"><label>Your name<input name="name" autocomplete="name" required maxlength="100"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="full">What do you need?<select name="kind" required><option value="">Choose a project type</option><option>Business website</option><option>Online store</option><option>Landing page</option><option>Something else</option></select></label><label class="full">Project details<textarea name="details" required maxlength="6000" placeholder="What should your website help you achieve?"></textarea></label></div><button class="button" id="form-button">Download project brief <span aria-hidden="true">↓</span></button><p id="form-status" role="status">Download a copy of your brief. Online enquiries are coming soon.</p></form></div></section>
